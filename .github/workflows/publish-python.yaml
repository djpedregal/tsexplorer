name: publish-python

# Publishes the Python package (folder python/) with trusted publishing:
# no tokens, PyPI and TestPyPI trust this workflow and its environment.
# Run it by hand (Actions > publish-python > Run workflow), first with
# testpypi and then with pypi. A version cannot be uploaded twice.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
      url: ${{ inputs.target == 'pypi' && 'https://pypi.org/project/tsexplorer/' || 'https://test.pypi.org/project/tsexplorer/' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.target == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
